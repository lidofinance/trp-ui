name: CI K8s Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feat/k8s-dev-setup
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

env:
  APP: trp-ui
  REGISTRY: registry.staging.k8s-staging.org
  REPOSITORY: team-daotech
  REGISTRY_USER: robot$team-daotech-rw
  IMAGE_TAG: staging
jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    name: Build and push staging image
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to staging Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_STAGE_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ env.IMAGE_TAG }}
          builder: ${{ steps.buildx.outputs.name }}
